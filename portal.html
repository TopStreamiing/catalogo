<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirigiendo al portal | ChestTop</title>

  <meta name="robots" content="noindex, nofollow" />

  <script>
    const PORTAL_URL = "https://portal-test.chesttop.com/";

    const destino = PORTAL_URL + window.location.search + window.location.hash;

    setTimeout(() => {
      window.location.replace(destino);
    }, 700);
  </script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.16), transparent 34%),
        linear-gradient(180deg,#050812,#0b0f17);
      color:#f8fafc;
    }

    .card{
      width:min(430px,94vw);
      padding:30px 26px;
      border-radius:28px;
      text-align:center;
      border:1px solid rgba(255,255,255,.10);
      background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(2,6,23,.90));
      box-shadow:0 28px 90px rgba(0,0,0,.45);
    }

    .logo{
      width:86px;
      height:86px;
      margin:0 auto 18px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      background:linear-gradient(135deg,#38bdf8,#22c55e);
      box-shadow:0 18px 45px rgba(56,189,248,.22);
    }

    h1{
      margin:0 0 8px;
      font-size:24px;
      line-height:1.15;
      letter-spacing:-.03em;
    }

    p{
      margin:0;
      color:#94a3b8;
      font-size:14px;
      line-height:1.45;
    }

    .bar{
      position:relative;
      width:100%;
      height:7px;
      margin:22px 0 18px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.10);
    }

    .bar::before{
      content:"";
      position:absolute;
      top:0;
      left:-45%;
      width:45%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#38bdf8,#22c55e);
      animation:loading 1.2s ease-in-out infinite;
    }

    @keyframes loading{
      0%{left:-45%;}
      100%{left:100%;}
    }

    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:16px;
      min-height:44px;
      padding:11px 16px;
      border-radius:15px;
      color:#ffffff;
      font-weight:900;
      text-decoration:none;
      background:linear-gradient(135deg,#2563eb,#06b6d4);
      box-shadow:0 14px 30px rgba(37,99,235,.24);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🔐</div>
    <h1>Redirigiendo al portal</h1>
    <p>Estamos abriendo tu acceso seguro de clientes.</p>

    <div class="bar"></div>

    <p>Si no se abre automáticamente, toca el botón.</p>

    <a id="portalLink" href="https://portal-test.chesttop.com/">
      Ir al portal
    </a>
  </main>

  <script>
    document.getElementById("portalLink").href = destino;
  </script>
</body>
</html>
